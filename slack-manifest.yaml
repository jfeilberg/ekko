display_information:
  name: Ekko
  description: A Slack-native AI agent.
  background_color: "#111827"
features:
  slash_commands:
    - command: /ekko
      url: https://YOUR-VERCEL-URL/api/webhooks/slack
      description: Ask Ekko a quick one-off question
      usage_hint: What's on my plate today?
      should_escape: false
  bot_user:
    display_name: Ekko
    always_online: true
  app_home:
    home_tab_enabled: false
    messages_tab_enabled: true
    messages_tab_read_only_enabled: false
  assistant_view:
    assistant_description: An AI agent that can use your connected tools.
    suggested_prompts:
      - title: "What can you do?"
        message: "What can you do?"
oauth_config:
  redirect_urls:
    - https://YOUR-VERCEL-URL/
  scopes:
    bot:
      - app_mentions:read
      - assistant:write
      - channels:history
      - chat:write
      - chat:write.public
      - commands
      - files:read
      - files:write
      - groups:history
      - im:history
      - im:read
      - im:write
      - search:read.public
      - users:read
settings:
  event_subscriptions:
    request_url: https://YOUR-VERCEL-URL/api/webhooks/slack
    bot_events:
      - app_mention
      - assistant_thread_context_changed
      - assistant_thread_started
      - message.channels
      - message.groups
      - message.im
  org_deploy_enabled: false
  socket_mode_enabled: false
  token_rotation_enabled: false
